name: Concord preview revision

on:
  push:
    branches:
      - "preview/concord-interactivity-20260910"
    paths:
      - ".preview/apply-concord-revision"

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact preview branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve exact production-derived source
        run: cp index.html /tmp/index.original

      - name: Build interaction blocks
        run: python .preview/patch_concord.py

      - name: Restore original bytes and inject only the two enhancement blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, hashlib
          original = Path('/tmp/index.original').read_bytes()
          normalized = Path('index.html').read_text(encoding='utf-8')
          sm = re.search(r'<style id="ch-interactive-revision-css">.*?</style>', normalized, re.S)
          jm = re.search(r'<script id="ch-interactive-revision-js">.*?</script>', normalized, re.S)
          assert sm and jm, 'Enhancement blocks were not generated'
          assert b'id="ch-interactive-revision-css"' not in original
          assert b'id="ch-interactive-revision-js"' not in original
          nl = b'\r\n' if original.count(b'\r\n') > original.count(b'\n') / 2 else b'\n'
          style = sm.group(0).encode('utf-8').replace(b'\n', nl)
          script = jm.group(0).encode('utf-8').replace(b'\n', nl)
          updated = original.replace(b'</head>', style + nl + b'</head>', 1)
          updated = updated.replace(b'</body>', script + nl + b'</body>', 1)
          restored = updated.replace(style + nl, b'', 1).replace(script + nl, b'', 1)
          assert restored == original, 'Scope validation failed: original bytes changed'
          Path('index.html').write_bytes(updated)
          print('Original SHA256:', hashlib.sha256(original).hexdigest())
          print('Updated  SHA256:', hashlib.sha256(updated).hexdigest())
          print('Byte-for-byte scope validation passed')
          PY

      - name: Validate functional markers
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_bytes()
          assert s.count(b'id="ch-interactive-revision-css"') == 1
          assert s.count(b'id="ch-interactive-revision-js"') == 1
          assert b"const removeKeys=['calcDisclaimer','legal'" in s
          assert b'const quizCopy=' in s
          assert b'const engineCopy=' in s
          print('Functional validation passed')
          PY

      - name: Save exact preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: concord-house-interactive-preview
          path: index.html
          if-no-files-found: error

      - name: Commit only the revised production-derived index
        run: |
          git config user.name "Concord House Preview Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .preview
          rm -f .github/workflows/concord-preview-revision.yml
          git add -A
          git commit -m "Preview interactive engine and decision test"
          git push origin HEAD:"preview/concord-interactivity-20260910"
