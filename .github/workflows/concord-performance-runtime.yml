name: Concord performance runtime
on:
  push:
    branches: ["preview/concord-performance-20260910"]
    paths: [".perf3/run"]
permissions:
  contents: write
jobs:
  optimize-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply targeted runtime optimization
        run: python .perf3/patch_runtime.py
      - name: Validate optimized site
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          checks={
            'external assets':'assets/ch-' in s and 'data:image/webp;base64,' not in s,
            'hero offscreen gate':'heroActive' in s,
            'cinematic 30fps':'targetFps=motion?30:6' in s,
            'mobile DPR':'innerWidth<900?1:1.5' in s,
            'quiz preserved':'quizCopy' in s,
            'engine preserved':'engineCopy' in s,
            'all languages': all(x in s for x in ["'ru'","'ky'","'en'"])
          }
          print(checks)
          assert all(checks.values())
          print('Optimized HTML bytes:',Path('index.html').stat().st_size)
          print('WebP assets:',[(x.name,x.stat().st_size) for x in Path('assets').glob('*.webp')])
          PY
      - name: Remove temporary diagnostics and commit clean preview
        run: |
          git config user.name "Concord House Performance Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .perf2 .perf3
          rm -f .github/workflows/concord-performance-inspect.yml .github/workflows/concord-performance-runtime.yml
          rm -f performance-report.json
          git add -A
          git commit -m "Reduce animation and compositor load"
          git push origin HEAD:"preview/concord-performance-20260910"
