name: Fix English runtime localization
on:
  push:
    branches:
      - preview/concord-performance-20260910
    paths:
      - .github/workflows/fix-en-runtime-preview.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix runtime language detection
        run: python .tmp/fix_en_runtime.py
      - name: Commit fixes
        run: |
          rm -f .tmp/fix_en_runtime.py .github/workflows/fix-en-runtime-preview.yml
          rmdir .tmp 2>/dev/null || true
          git config user.name "AdilKaibaliev"
          git config user.email "156720853+AdilKaibaliev@users.noreply.github.com"
          git add -A
          git commit -m "Fix English runtime localization and copy syntax"
          git push
